<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin login — PTSA Bot</title>
  <link rel="icon" href="{{ favicon_url }}" type="image/png" />
  <style>
    :root {
      --bg: #0f2a24;
      --panel: #17352d;
      --ink: #f3f7f5;
      --muted: #a8c0b7;
      --accent: #25d366;
      --accent-ink: #0b1f19;
      --danger: #ffb4a8;
      --border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, #1f4d3f 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, #0a3d2e 0%, transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    .card {
      width: min(28rem, 100%);
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.75rem;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.4rem; font-weight: 650; }
    p { margin: 0 0 1.25rem; color: var(--muted); line-height: 1.45; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.4rem; }
    input[type="password"] {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.25);
      color: var(--ink);
      border-radius: 0.65rem;
      padding: 0.75rem 0.85rem;
      font: inherit;
      margin-bottom: 1rem;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 0.65rem;
      padding: 0.7rem 1rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-ink);
    }
    .flash.error {
      margin-bottom: 1rem;
      padding: 0.75rem 0.9rem;
      border-radius: 0.65rem;
      background: rgba(255, 180, 168, 0.12);
      color: var(--danger);
      border: 1px solid rgba(255, 180, 168, 0.25);
    }
    .hint { margin-top: 1rem; font-size: 0.85rem; color: var(--muted); }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #d7ffe9; }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .brand img {
      width: 2.75rem;
      height: 2.75rem;
      object-fit: contain;
      border-radius: 999px;
      background: #000;
    }
    .brand-text {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.35;
    }
    .brand-text strong {
      display: block;
      color: var(--ink);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="{{ logo_url }}" alt="Crone Middle School logo" />
      <div class="brand-text">
        <strong>Crone Middle School PTSA</strong>
        Event Assistant admin
      </div>
    </div>
    <h1>Admin login</h1>
    <p>Manage the group link, intro message, and event FAQ.</p>
    {% if error %}
      <div class="flash error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/admin/login">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autofocus />
      <button type="submit">Log in</button>
    </form>
    <p class="hint">Password is <code>ADMIN_PASSWORD</code> in Cloud Run / <code>.env</code>.</p>
  </main>
</body>
</html>
